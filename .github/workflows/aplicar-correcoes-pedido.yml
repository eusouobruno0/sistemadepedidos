name: Aplicar correcoes do pedido
on:
  push:
    branches: [corrige-numero-e-status-edicao]
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: corrige-numero-e-status-edicao
      - name: Aplicar ajustes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/PedidosList.tsx')
          s = p.read_text()
          s = s.replace("p.numero === 'RASCUNHO'", "numeroSistema === 'RASCUNHO'")
          s = s.replace("                            p.numero\n", "                            numeroSistema\n")
          s = s.replace("                                p.numero\n", "                                numeroSistema\n")
          p.write_text(s)
          PY
      - name: Salvar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PedidosList.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Ajusta numero do pedido na listagem"
          git push origin HEAD:corrige-numero-e-status-edicao
